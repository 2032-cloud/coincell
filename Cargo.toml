[package]
name = "coincell"
version = "0.1.1"
edition = "2024"

[dependencies]
display-info = "0.5.9"
eframe = "0.36.1"
image = "0.25.10"
interprocess = "2.4.2"
tray-icon = "0.24.2"
anyhow = "*"
directories = "6.0.0"
lazy_static = "1.5.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
toml = "1.1.4"
reqwest = { version = "0.13.4", features = ["blocking", "json", "form"] }
thiserror = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "url"] }
serde_json = "1.0.151"
whoami = "2.1.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
egui_extras = { version = "0.36", features = ["image", "http"] }
fuzzy-matcher = "0.3.7"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rfd = "0.17.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "ansi"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

[profile.release]
strip = "symbols"   # smaller binaries; Sentry still gets frames from its own backtrace capture
lto = "thin"
codegen-units = 1
# panic left at "unwind" on purpose, the Sentry panic hook needs it.
